version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  # Minor and patch bumps arrive as one grouped PR; each major bump gets its own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
