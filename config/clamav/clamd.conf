# clamd.conf for the production clamav container.
# Mounted over /etc/clamav/clamd.conf by docker-compose.production.yml.
# Matches the clamav/clamav:stable image's stock effective settings, plus
# ConcurrentDatabaseReload no (see bottom).

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Reload the signature database in place instead of double-buffering.
# The default concurrent reload briefly holds two copies of the ~1GB
# database — a 2x spike that repeatedly tipped the 4GB host into global
# OOM when freshclam delivered updates (kills observed May-Aug 2026, all
# landing on clamd). Scanning pauses briefly during reload instead;
# attachment scanning is fail-open, so uploads are unaffected.
ConcurrentDatabaseReload no
